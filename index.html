<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>2 months, my future doctor 🌅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#FFF1E6; --sky2:#FFD9D2; --sky3:#F7B6C2;
    --ink:#4A2C3A; --soft:#8A6475; --rose:#E0607E; --gold:#E9A23B; --sage:#5FA48C; --card:rgba(255,255,255,.55);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky1:#2A1F3D; --sky2:#4A2C4F; --sky3:#7A3F5E;
      --ink:#FFF1E6; --soft:#E8C4CF; --rose:#FF8FA9; --gold:#FFC76B; --sage:#8FD1B7; --card:rgba(255,255,255,.08);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --sky1:#2A1F3D; --sky2:#4A2C4F; --sky3:#7A3F5E;
    --ink:#FFF1E6; --soft:#E8C4CF; --rose:#FF8FA9; --gold:#FFC76B; --sage:#8FD1B7; --card:rgba(255,255,255,.08);
    color-scheme:dark;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%); user-select:none; }
  .stage{ position:relative; width:100%; height:100%; overflow:hidden; padding-top:env(safe-area-inset-top,0px); }

  .sun{ position:absolute; left:50%; bottom:-70px; width:240px; height:240px; margin-left:-120px; border-radius:50%;
    background:radial-gradient(circle,var(--gold),rgba(233,162,59,0) 70%); opacity:.55; z-index:1; animation:rise 6s ease-in-out infinite; }
  @keyframes rise{ 0%,100%{transform:translateY(10px) scale(1);} 50%{transform:translateY(-8px) scale(1.07);} }
  .petals{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .petal{ position:absolute; top:-20px; width:12px; height:16px; background:var(--rose); opacity:.5; border-radius:80% 0 80% 0; animation:fall linear infinite; }
  @keyframes fall{ to{ transform:translate(var(--dx),110vh) rotate(360deg); } }

  .bloom-row{ position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:clamp(8px,2.6vw,20px); z-index:3; pointer-events:none; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); }
  .bud{ font-size:18px; filter:grayscale(1); opacity:.35; transform:scale(.7); transition:all .6s cubic-bezier(.34,1.56,.64,1); }
  .bud.lit{ filter:none; opacity:1; transform:scale(1.1); }

  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(14px,3.4vw,24px); padding:30px 24px 90px; z-index:6; transition:opacity .7s ease,filter .7s ease; }
  .scene.hidden{ opacity:0; pointer-events:none; filter:blur(6px); }
  .eyebrow{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; letter-spacing:.08em; font-size:clamp(13px,3.4vw,15px); color:var(--soft); text-align:center; }
  .title{ font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(32px,8.5vw,54px); text-align:center; color:var(--rose); line-height:1.2; margin:0; }
  .sub{ font-family:'Cormorant Garamond',serif; font-size:clamp(15px,4vw,19px); color:var(--soft); text-align:center; max-width:420px; margin:0; line-height:1.7; }
  .btn{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:18px; letter-spacing:.04em; border:1.5px solid var(--rose); background:var(--card); color:var(--rose); border-radius:999px; padding:13px 34px; cursor:pointer; transition:transform .18s ease,box-shadow .2s ease; }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(224,96,126,.25); }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:2px solid var(--rose); outline-offset:3px; }

  /* stethoscope heart cover */
  .steth{ width:clamp(130px,32vw,170px); transition:transform .8s ease,opacity .6s ease; }
  .steth svg{ width:100%; height:auto; overflow:visible; }
  .steth.opening{ transform:scale(1.08) rotate(-3deg); }
  .steth.flyaway{ transform:translateY(-40px) scale(.7); opacity:0; }
  .steth .beat{ transform-origin:50% 50%; animation:beat 1.2s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{transform:scale(1);} 14%{transform:scale(1.08);} 28%{transform:scale(1);} 42%{transform:scale(1.04);} }

  /* ECG scene */
  .ecg{ width:min(86vw,420px); height:90px; }
  .ecg path{ fill:none; stroke:var(--rose); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:700; stroke-dashoffset:700; }
  .ecg.show path{ animation:draw 3s ease-out forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .cap{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(16px,4.2vw,20px); color:var(--soft); text-align:center; max-width:380px; margin:0; opacity:0; line-height:1.7; }
  .cap.show{ animation:fin .9s ease forwards; }
  .cap.d1{ animation-delay:2.2s; } .cap.d2{ animation-delay:3.4s; }
  .cap-big{ font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(26px,7vw,38px); color:var(--rose); }
  .cbtn{ opacity:0; animation:fin .9s ease 4.6s forwards; }
  @keyframes fin{ to{opacity:1;} }

  /* letter */
  .progress-wrap{ position:absolute; top:env(safe-area-inset-top,0px); left:0; right:0; padding:16px 20px 0; z-index:20; }
  .progress-track{ height:3px; border-radius:3px; background:rgba(224,96,126,.2); }
  .progress-fill{ height:100%; width:0; border-radius:3px; background:var(--rose); transition:width .5s ease; }
  .page{ max-width:640px; width:100%; padding:0 12px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .page-mark{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--soft); opacity:.8; }
  .page-text{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(21px,5.4vw,31px); line-height:1.6; text-align:center; min-height:2.4em; }
  .accent{ color:var(--sage); font-style:italic; }
  .accent2{ color:var(--rose); font-style:italic; }
  .cursor{ display:inline-block; width:2px; height:1em; background:var(--rose); margin-left:2px; vertical-align:-.15em; animation:blink .9s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0;} }
  .hint{ position:absolute; bottom:calc(70px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--soft); opacity:0; z-index:10; }
  .hint.show{ animation:fin2 .6s ease .3s forwards; }
  @keyframes fin2{ to{opacity:.8;} }

  /* final */
  .final{ position:relative; display:flex; flex-direction:column; align-items:center; gap:16px; max-width:600px; text-align:center; }
  .final>*{ opacity:0; }
  .final.show>*{ animation:fin .8s ease forwards; }
  .final.show>*:nth-child(2){ animation-delay:.3s; } .final.show>*:nth-child(3){ animation-delay:.6s; }
  .final.show>*:nth-child(4){ animation-delay:.9s; } .final.show>*:nth-child(5){ animation-delay:1.2s; }
  .final-emoji{ font-size:clamp(38px,10vw,54px); }
  .final-body{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(17px,4.2vw,21px); line-height:1.85; }
  .promise{ background:var(--card); border:1px solid rgba(224,96,126,.35); border-radius:18px; padding:14px 20px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(16px,4vw,19px); line-height:1.7; color:var(--soft); }
  .sign{ font-family:'Dancing Script',cursive; font-weight:700; font-size:clamp(22px,5.5vw,28px); color:var(--rose); }
  .float{ position:absolute; pointer-events:none; z-index:7; transition:transform 3.4s ease-out,opacity 3.4s ease-out; color:var(--rose); }

  @media (prefers-reduced-motion:reduce){
    .sun,.petal,.beat,.cursor{ animation:none!important; }
    .cap,.cbtn,.final>*{ opacity:1!important; animation:none!important; }
    .ecg path{ stroke-dashoffset:0!important; animation:none!important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="sun"></div>
  <div class="petals" id="petals"></div>
  <div class="bloom-row" id="bloomRow"></div>

  <section class="scene" id="cover">
    <div class="eyebrow">two months of you</div>
    <div class="steth" id="steth">
      <svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 14 v34 a24 24 0 0 0 48 0 v-34" fill="none" stroke="var(--sage)" stroke-width="5" stroke-linecap="round"/>
        <path d="M54 72 v22 a26 26 0 0 0 52 0 v-10" fill="none" stroke="var(--sage)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="106" cy="76" r="9" fill="none" stroke="var(--sage)" stroke-width="5"/>
        <g class="beat"><path d="M106 38 C100 28 86 32 86 44 C86 56 106 68 106 68 C106 68 126 56 126 44 C126 32 112 28 106 38 Z" fill="var(--rose)"/></g>
      </svg>
    </div>
    <h1 class="title">happy 2 months,<br>my future doctor</h1>
    <p class="sub">close everything else for a minute. this one’s just for you.</p>
    <button class="btn" id="openBtn">read it</button>
  </section>

  <section class="scene hidden" id="ecgScene">
    <svg class="ecg" id="ecg" viewBox="0 0 420 90" preserveAspectRatio="none">
      <path d="M0 50 H110 L125 50 L138 14 L156 82 L170 50 H230 L244 50 L256 30 L268 66 L280 50 H330 C345 20 372 20 380 42 C388 20 415 24 420 50"/>
    </svg>
    <p class="cap d1">one day, they’ll write <b style="color:var(--rose)">Dr.</b> before your name.</p>
    <p class="cap d2">and I’ll be the proudest person in the room, listening to every heartbeat you save.</p>
    <div class="cbtn"><button class="btn" id="ecgBtn">come closer</button></div>
  </section>

  <section class="scene hidden" id="letterScene">
    <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="fill"></div></div></div>
    <div class="page"><div class="page-mark" id="mark"></div><div class="page-text" id="text"></div></div>
    <div class="hint" id="hint">tap to keep reading</div>
  </section>
</div>

<script>
(function(){
  const pages = [
    "My wifeyy…",
    "two months. it feels like a moment and a lifetime at once.",
    "we found each other through the same faith, the same Laddu ji, and the same silly, endless conversations.",
    "and somewhere in all of that, you became <span class=\"accent2\">my favourite person</span>.",
    "I watch you chase your dream of becoming a <span class=\"accent\">doctor</span>, and I get so proud.",
    "the late nights, the books, the patience — all of it will be worth it, and I’ll be right beside you.",
    "you’re going to heal so many people, wifeyy.",
    "and I made you a promise: give me <span class=\"accent2\">two to three years</span>,",
    "and then we’ll be married. I mean it with my whole heart.",
    "until then, I’ll keep showing up, keep cheering, keep choosing you.",
    "happy two months, wifeyy."
  ];

  const $ = id => document.getElementById(id);

  // petals
  const pet = $('petals');
  for(let i=0;i<18;i++){
    const p=document.createElement('div'); p.className='petal';
    p.style.cssText=`left:${Math.random()*100}%;--dx:${Math.round(Math.random()*120-60)}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s;transform:scale(${.6+Math.random()*.8})`;
    pet.appendChild(p);
  }
  // blooms
  const row=$('bloomRow');
  pages.forEach(()=>{ const b=document.createElement('div'); b.className='bud'; b.textContent='🌸'; row.appendChild(b); });
  const buds=Array.from(row.children);

  let opened=false;
  $('openBtn').addEventListener('click',()=>{
    if(opened) return; opened=true;
    $('steth').classList.add('opening');
    setTimeout(()=>$('steth').classList.add('flyaway'),450);
    setTimeout(()=>{
      $('cover').classList.add('hidden');
      $('ecgScene').classList.remove('hidden');
      $('ecg').classList.add('show');
      $('ecgScene').querySelectorAll('.cap').forEach(c=>c.classList.add('show'));
    },950);
  });
  $('ecgBtn').addEventListener('click',()=>{
    $('ecgScene').classList.add('hidden');
    $('letterScene').classList.remove('hidden');
    render();
  });

  const text=$('text'), mark=$('mark'), fill=$('fill'), hint=$('hint');
  const total=pages.length+1;
  let idx=0, typing=false, timer=null;

  function type(html){
    const tk=html.match(/<[^>]+>|[^<]/g)||[]; let i=0;
    text.innerHTML='<span class="cursor"></span>'; typing=true; hint.classList.remove('show');
    (function step(){
      if(i>=tk.length){ typing=false; const c=text.querySelector('.cursor'); if(c) c.remove(); hint.classList.add('show'); return; }
      const ch=tk[i++], cur=text.querySelector('.cursor');
      if(ch.startsWith('<')){ const t=document.createElement('span'); t.innerHTML=ch; text.insertBefore(t.firstChild||document.createTextNode(''),cur); }
      else text.insertBefore(document.createTextNode(ch),cur);
      timer=setTimeout(step,/[….,—]/.test(ch)?180:32);
    })();
  }
  function render(){
    fill.style.width=(((idx+1)/total)*100)+'%';
    if(idx<pages.length){ mark.textContent=`page ${idx+1} of ${pages.length}`; buds[idx].classList.add('lit'); type(pages[idx]); }
    else final();
  }
  function next(){
    if(typing){ clearTimeout(timer); text.innerHTML=pages[idx]; typing=false; hint.classList.add('show'); return; }
    if(idx>=pages.length) return; idx++; render();
  }
  $('letterScene').addEventListener('click',e=>{ if(!e.target.closest('.final')) next(); });

  function final(){
    document.querySelector('.page').style.display='none';
    document.querySelector('.progress-wrap').style.display='none';
    hint.classList.remove('show');
    const f=document.createElement('div'); f.className='final';
    f.innerHTML=`
      <div class="final-emoji">🩺💍</div>
      <div class="title" style="font-size:clamp(32px,8.5vw,52px)">Happy 2 Months, Wifeyy</div>
      <div class="final-body">may Krishna ji keep your path to becoming a doctor bright, and keep us close all the way there.</div>
      <div class="promise">my promise: 2–3 years, and then you’re my wife. 🪷</div>
      <div class="sign">forever yours 🌅</div>`;
    $('letterScene').appendChild(f);
    requestAnimationFrame(()=>f.classList.add('show'));
    buds.forEach(b=>b.classList.add('lit'));
    let n=0; const t=setInterval(()=>{
      const h=document.createElement('div'); h.className='float'; h.textContent='♥';
      h.style.cssText=`left:${28+Math.random()*44}%;bottom:70px;font-size:${13+Math.random()*10}px;opacity:.85`;
      $('letterScene').appendChild(h);
      requestAnimationFrame(()=>{ h.style.transform=`translateY(-${170+Math.random()*120}px) translateX(${Math.round(Math.random()*50-25)}px)`; h.style.opacity='0'; });
      setTimeout(()=>h.remove(),3500);
      if(++n>6) clearInterval(t);
    },450);
  }
})();
</script>
</body>
</html>
